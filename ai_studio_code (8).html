  <style>
    :root {
      --font-mono: 'Fira Code', 'Courier New', Courier, monospace;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Dark Default Theme */
      --bg-primary: #09090b;
      --bg-secondary: #121214;
      --bg-tertiary: #1c1c1f;
      --bg-card: #18181b;
      --border: #27272a;
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --glass: rgba(18, 18, 20, 0.7);
      --blur: 16px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    [data-theme="light"] {
      --bg-primary: #f4f4f5;
      --bg-secondary: #ffffff;
      --bg-tertiary: #e4e4e7;
      --bg-card: #ffffff;
      --border: #e4e4e7;
      --text-primary: #09090b;
      --text-secondary: #71717a;
      --accent: #4f46e5;
      --accent-light: #6366f1;
      --accent-gradient: linear-gradient(135deg, #4f46e5, #9333ea);
      --glass: rgba(255, 255, 255, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    /* Core Layout */
    .app-container {
      display: flex;
      flex: 1;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Side Navigation (Desktop) */
    .side-nav {
      width: 260px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
      z-index: 50;
    }

    @media (max-width: 768px) {
      .side-nav {
        display: none;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.25rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2rem;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      list-style: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-primary);
      background-color: var(--border);
    }

    .nav-item.active {
      background: var(--accent-gradient);
      color: white;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }

    /* Bottom Navigation (Mobile) */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background-color: var(--glass);
      backdrop-filter: blur(var(--blur));
      border-top: 1px solid var(--border);
      z-index: 100;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (max-width: 768px) {
      .bottom-nav {
        display: flex;
      }
    }

    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .bottom-nav-item.active {
      color: var(--accent-light);
    }

    .bottom-nav-item svg {
      width: 20px;
      height: 20px;
    }

    /* Main Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding-bottom: 80px; /* offset for bottom nav on mobile */
    }

    @media (min-width: 769px) {
      .main-content {
        padding-bottom: 0;
      }
    }

    /* Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background-color: var(--glass);
      backdrop-filter: blur(var(--blur));
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .search-container {
      position: relative;
      width: 100%;
      max-width: 480px;
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .search-container svg {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 0.5rem;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      color: var(--text-primary);
      background-color: var(--border);
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
    }

    /* Home View Elements */
    .view-section {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero */
    .hero-banner {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem 2rem;
      margin-bottom: 2.5rem;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .hero-banner::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    .hero-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .hero-sub {
      font-size: 1.1rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Animated Rotating Message */
    .rotating-wrapper {
      height: 2rem;
      overflow: hidden;
      position: relative;
    }

    .rotating-text {
      position: absolute;
      font-weight: 600;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .rotating-text.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .stat-icon {
      background: rgba(99, 102, 241, 0.1);
      color: var(--accent-light);
      padding: 0.75rem;
      border-radius: 8px;
    }

    .stat-icon svg {
      width: 24px;
      height: 24px;
    }

    .stat-val {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Categories Selector */
    .category-scroll {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-pill {
      white-space: nowrap;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background-color: var(--bg-card);
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-pill:hover, .category-pill.active {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .category-pill.active {
      background-color: var(--accent);
      color: white;
    }

    /* Tools Grid */
    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 3rem;
    }

    .tool-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      position: relative;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      justify-content: space-between;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: var(--shadow-lg);
    }

    .tool-meta {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .tool-icon {
      background-color: var(--bg-primary);
      padding: 0.6rem;
      border-radius: 8px;
      color: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
    }

    .tool-icon svg {
      width: 20px;
      height: 20px;
    }

    .tool-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .tool-desc {
      font-size: 0.825rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .btn-fav {
      color: var(--text-secondary);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-fav:hover {
      background-color: var(--border);
    }

    .btn-fav.active {
      color: var(--error);
    }

    .btn-fav svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Core Tool Workspace Layout */
    .tool-workspace {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      animation: fadeIn 0.3s ease-out;
    }

    .tool-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .tool-actions-toolbar {
      display: flex;
      gap: 0.5rem;
    }

    .tool-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      border-color: var(--accent);
      background-color: var(--bg-tertiary);
    }

    .tool-btn-primary {
      background: var(--accent-gradient);
      border: none;
      color: white;
    }

    .tool-btn-primary:hover {
      opacity: 0.9;
    }

    .tool-grid-panels {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 992px) {
      .tool-grid-panels {
        grid-template-columns: 1fr 1fr;
      }
    }

    .panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-area, .output-area {
      width: 100%;
      min-height: 280px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }

    .input-area:focus, .output-area:focus {
      border-color: var(--accent);
    }

    /* Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-control {
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .checkbox-group input {
      accent-color: var(--accent);
    }

    /* Toast Notification System */
    .toast-container {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 1000;
      pointer-events: none;
    }

    .toast {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      color: var(--text-primary);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      font-weight: 500;
      pointer-events: auto;
      transform: translateX(120%);
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      max-width: 320px;
    }

    @keyframes slideIn {
      to { transform: translateX(0); }
    }

    .toast.error { border-left-color: var(--error); }
    .toast.success { border-left-color: var(--success); }

    /* Custom Modal Framework */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 90%;
      max-width: 540px;
      box-shadow: var(--shadow-lg);
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      max-height: 70vh;
      font-size: 0.925rem;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    /* JSON Tree styles */
    .json-tree-root { margin-top: 1rem; }
    .json-tree-node { margin: 4px 0; font-family: var(--font-mono); font-size: 0.85rem; }
    .json-tree-toggle { cursor: pointer; color: var(--accent-light); font-weight: bold; margin-right: 4px; user-select: none; }
    .json-tree-key { color: #f43f5e; font-weight: 500; }
    .json-tree-value.json-tree-string { color: #10b981; }
    .json-tree-value.json-tree-number { color: #3b82f6; }
    .json-tree-value.json-tree-boolean { color: #f59e0b; }
    .json-tree-value.json-tree-null { color: #6b7280; }

    /* Flexbox generator layout playground */
    .flexbox-playground {
      width: 100%;
      height: 200px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      padding: 8px;
      gap: 8px;
      overflow: hidden;
    }

    .flex-play-item {
      background: var(--accent-gradient);
      width: 50px;
      height: 50px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
    }

    /* Strength meter */
    .strength-bar {
      height: 6px;
      border-radius: 3px;
      background-color: var(--border);
      overflow: hidden;
      margin-top: 4px;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    /* Skeleton animations */
    .skeleton-line {
      height: 16px;
      background: linear-gradient(90deg, var(--border) 25%, var(--bg-tertiary) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: 4px;
      width: 100%;
    }

    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Diff Checker colors */
    .diff-container {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      white-space: pre-wrap;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
    }
    .diff-line { display: block; padding: 2px 4px; }
    .diff-added { background-color: rgba(16, 185, 129, 0.15); color: #10b981; }
    .diff-removed { background-color: rgba(239, 68, 68, 0.15); color: #ef4444; }
