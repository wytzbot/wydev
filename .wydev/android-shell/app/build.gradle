plugins { id 'com.android.application' }

android {
    namespace 'com.wydev.wrapper'
    compileSdk 36

    defaultConfig {
        applicationId 'com.wydev.wrapper'
        minSdk 23
        targetSdk 36   // Google Play requires API 36+ for new apps/updates since Aug 31, 2026
        versionCode (project.findProperty('vc') ?: '1').toInteger()
        versionName (project.findProperty('vn') ?: '1.0').toString()
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }

    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    implementation "androidx.fragment:fragment:1.8.5"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
