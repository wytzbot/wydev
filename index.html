  <style>
    :root {
      --font-mono: 'Fira Code', 'Courier New', Courier, monospace;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Dark Default Theme */
      --bg-primary: #09090b;
      --bg-secondary: #121214;
      --bg-tertiary: #1c1c1f;
      --bg-card: #18181b;
      --border: #27272a;
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --glass: rgba(18, 18, 20, 0.7);
      --blur: 16px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    [data-theme="light"] {
      --bg-primary: #f4f4f5;
      --bg-secondary: #ffffff;
      --bg-tertiary: #e4e4e7;
      --bg-card: #ffffff;
      --border: #e4e4e7;
      --text-primary: #09090b;
      --text-secondary: #71717a;
      --accent: #4f46e5;
      --accent-light: #6366f1;
      --accent-gradient: linear-gradient(135deg, #4f46e5, #9333ea);
      --glass: rgba(255, 255, 255, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    /* Core Layout */
    .app-container {
      display: flex;
      flex: 1;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Side Navigation (Desktop) */
    .side-nav {
      width: 260px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
      z-index: 50;
    }

    @media (max-width: 768px) {
      .side-nav {
        display: none;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.25rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2rem;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      list-style: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-primary);
      background-color: var(--border);
    }

    .nav-item.active {
      background: var(--accent-gradient);
      color: white;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }

    /* Bottom Navigation (Mobile) */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background-color: var(--glass);
      backdrop-filter: blur(var(--blur));
      border-top: 1px solid var(--border);
      z-index: 100;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (max-width: 768px) {
      .bottom-nav {
        display: flex;
      }
    }

    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .bottom-nav-item.active {
      color: var(--accent-light);
    }

    .bottom-nav-item svg {
      width: 20px;
      height: 20px;
    }

    /* Main Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding-bottom: 80px; /* offset for bottom nav on mobile */
    }

    @media (min-width: 769px) {
      .main-content {
        padding-bottom: 0;
      }
    }

    /* Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background-color: var(--glass);
      backdrop-filter: blur(var(--blur));
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .search-container {
      position: relative;
      width: 100%;
      max-width: 480px;
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .search-container svg {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 0.5rem;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      color: var(--text-primary);
      background-color: var(--border);
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
    }

    /* Home View Elements */
    .view-section {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero */
    .hero-banner {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem 2rem;
      margin-bottom: 2.5rem;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .hero-banner::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    .hero-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .hero-sub {
      font-size: 1.1rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Animated Rotating Message */
    .rotating-wrapper {
      height: 2rem;
      overflow: hidden;
      position: relative;
    }

    .rotating-text {
      position: absolute;
      font-weight: 600;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .rotating-text.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .stat-icon {
      background: rgba(99, 102, 241, 0.1);
      color: var(--accent-light);
      padding: 0.75rem;
      border-radius: 8px;
    }

    .stat-icon svg {
      width: 24px;
      height: 24px;
    }

    .stat-val {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Categories Selector */
    .category-scroll {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-pill {
      white-space: nowrap;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background-color: var(--bg-card);
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-pill:hover, .category-pill.active {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .category-pill.active {
      background-color: var(--accent);
      color: white;
    }

    /* Tools Grid */
    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 3rem;
    }

    .tool-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      position: relative;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      justify-content: space-between;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: var(--shadow-lg);
    }

    .tool-meta {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .tool-icon {
      background-color: var(--bg-primary);
      padding: 0.6rem;
      border-radius: 8px;
      color: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
    }

    .tool-icon svg {
      width: 20px;
      height: 20px;
    }

    .tool-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .tool-desc {
      font-size: 0.825rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .btn-fav {
      color: var(--text-secondary);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-fav:hover {
      background-color: var(--border);
    }

    .btn-fav.active {
      color: var(--error);
    }

    .btn-fav svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Core Tool Workspace Layout */
    .tool-workspace {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      animation: fadeIn 0.3s ease-out;
    }

    .tool-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .tool-actions-toolbar {
      display: flex;
      gap: 0.5rem;
    }

    .tool-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      border-color: var(--accent);
      background-color: var(--bg-tertiary);
    }

    .tool-btn-primary {
      background: var(--accent-gradient);
      border: none;
      color: white;
    }

    .tool-btn-primary:hover {
      opacity: 0.9;
    }

    .tool-grid-panels {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 992px) {
      .tool-grid-panels {
        grid-template-columns: 1fr 1fr;
      }
    }

    .panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-area, .output-area {
      width: 100%;
      min-height: 280px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }

    .input-area:focus, .output-area:focus {
      border-color: var(--accent);
    }

    /* Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-control {
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .checkbox-group input {
      accent-color: var(--accent);
    }

    /* Toast Notification System */
    .toast-container {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 1000;
      pointer-events: none;
    }

    .toast {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      color: var(--text-primary);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      font-weight: 500;
      pointer-events: auto;
      transform: translateX(120%);
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      max-width: 320px;
    }

    @keyframes slideIn {
      to { transform: translateX(0); }
    }

    .toast.error { border-left-color: var(--error); }
    .toast.success { border-left-color: var(--success); }

    /* Custom Modal Framework */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 90%;
      max-width: 540px;
      box-shadow: var(--shadow-lg);
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      max-height: 70vh;
      font-size: 0.925rem;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    /* JSON Tree styles */
    .json-tree-root { margin-top: 1rem; }
    .json-tree-node { margin: 4px 0; font-family: var(--font-mono); font-size: 0.85rem; }
    .json-tree-toggle { cursor: pointer; color: var(--accent-light); font-weight: bold; margin-right: 4px; user-select: none; }
    .json-tree-key { color: #f43f5e; font-weight: 500; }
    .json-tree-value.json-tree-string { color: #10b981; }
    .json-tree-value.json-tree-number { color: #3b82f6; }
    .json-tree-value.json-tree-boolean { color: #f59e0b; }
    .json-tree-value.json-tree-null { color: #6b7280; }

    /* Flexbox generator layout playground */
    .flexbox-playground {
      width: 100%;
      height: 200px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      padding: 8px;
      gap: 8px;
      overflow: hidden;
    }

    .flex-play-item {
      background: var(--accent-gradient);
      width: 50px;
      height: 50px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
    }

    /* Strength meter */
    .strength-bar {
      height: 6px;
      border-radius: 3px;
      background-color: var(--border);
      overflow: hidden;
      margin-top: 4px;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    /* Skeleton animations */
    .skeleton-line {
      height: 16px;
      background: linear-gradient(90deg, var(--border) 25%, var(--bg-tertiary) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: 4px;
      width: 100%;
    }

    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Diff Checker colors */
    .diff-container {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      white-space: pre-wrap;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
    }
    .diff-line { display: block; padding: 2px 4px; }
    .diff-added { background-color: rgba(16, 185, 129, 0.15); color: #10b981; }
    .diff-removed { background-color: rgba(239, 68, 68, 0.15); color: #ef4444; }

  /************************************************************************
   * Router, View Rendering & Template Views
   ************************************************************************/
  function navigateTo(hash) {
    window.location.hash = hash;
  }

  window.addEventListener('hashchange', renderCurrentRoute);

  function renderCurrentRoute() {
    const hash = window.location.hash || '#home';
    const viewName = hash.split('/')[0];

    // Reset views states navigation highlights
    document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
      el.classList.remove('active');
      if (el.getAttribute('href') === viewName) {
        el.classList.add('active');
      }
    });

    if (viewName === '#home') {
      renderHome();
    } else if (viewName === '#settings') {
      renderSettings();
    } else if (viewName === '#about') {
      renderAbout();
    } else if (viewName.startsWith('#tool-')) {
      const toolId = viewName.replace('#tool-', '');
      renderTool(toolId);
    }
  }

  // Filter tools based on Search Input & Category
  function getFilteredTools() {
    const searchVal = document.getElementById('global-search').value.toLowerCase().trim();
    const cat = State.activeCategory;

    return TOOLS.filter(t => {
      const matchesSearch = t.name.toLowerCase().includes(searchVal) || 
                            t.description.toLowerCase().includes(searchVal) ||
                            t.keywords.toLowerCase().includes(searchVal);
      const matchesCategory = (cat === 'all' || t.category === cat);
      return matchesSearch && matchesCategory;
    });
  }

    const filtered = getFilteredTools();

    // Tools cards visual build
    let toolsHtml = filtered.map(t => {
      const isFav = State.favorites.includes(t.id);

  /************************************************************************
   * Dynamic Hero Script Rotation
   ************************************************************************/
  const bannerPhrases = [
    "Build Faster.",
    "Code Smarter.",
    "Everything Developers Need.",
    "One Toolbox.",
    "Productivity Starts Here."
  ];
  let rotateIdx = 0;
  let phraseInterval = null;

  function initHeroAnimation() {
    if (phraseInterval) clearInterval(phraseInterval);
    const target = document.getElementById('rotate-txt');
    if (!target) return;
    phraseInterval = setInterval(() => {
      rotateIdx = (rotateIdx + 1) % bannerPhrases.length;
      target.style.opacity = '0';
      target.style.transform = 'translateY(-10px)';
      setTimeout(() => {
        target.innerText = bannerPhrases[rotateIdx];
        target.style.transform = 'translateY(10px)';
        setTimeout(() => {
          target.style.opacity = '1';
          target.style.transform = 'translateY(0)';
        }, 50);
      }, 250);
    }, 3000);
  }

  /************************************************************************
   * Theme Toggle Scripting
   ************************************************************************/
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const newTheme = State.theme === 'dark' ? 'light' : 'dark';
    changeTheme(newTheme);
  });

  function changeTheme(themeVal) {
    State.theme = themeVal;
    localStorage.setItem('wydev_theme', themeVal);
    document.documentElement.setAttribute('data-theme', themeVal);
    showToast(`Switched to theme: ${themeVal}`, 'success');
  }

  function clearAppData() {
    localStorage.clear();
    showToast("Application data reset completed", "success");
    setTimeout(() => window.location.reload(), 1000);
  }

  /************************************************************************
   * Tools Logical Interactions Hub
   ************************************************************************/
  async function executeToolAction(toolId, action) {
    saveStat('runs');
    document.getElementById('stat-runs-num') ? document.getElementById('stat-runs-num').innerText = State.stats.runs : null;

    if (toolId === 'json-formatter') {
      const inputEl = document.getElementById('json-input');
      const textOutputEl = document.getElementById('json-text-output');
      if (action === 'example') {
        inputEl.value = JSON.stringify({ name: "WyDev", version: 1.0, active: true, config: { engine: "Local" }, tools: ["JSON Formatter", "Base64 Encoder", "Secure Passwords"] }, null, 2);
        showToast("Loaded example payload", "success");
      } else if (action === 'clear') {
        inputEl.value = '';
        textOutputEl.value = '';
        document.getElementById('json-tree-container').innerHTML = '';
        showToast("Inputs cleared", "success");
      } else if (action === 'format') {
        try {
          const parsed = JSON.parse(inputEl.value);
          textOutputEl.value = JSON.stringify(parsed, null, 2);
          renderJsonTreeVisual(parsed);
          showToast("Successfully formatted JSON!", "success");
        } catch (e) {
          showToast(`Error parsing: ${e.message}`, 'error');
        }
      } else if (action === 'minify') {
        try {
          const parsed = JSON.parse(inputEl.value);
          textOutputEl.value = JSON.stringify(parsed);
          showToast("Successfully minified JSON!", "success");
        } catch (e) {
          showToast(`Error parsing: ${e.message}`, 'error');
        }
      } else if (action === 'copy') {

  function toggleJsonOutputView(type) {
    const formattedBtn = document.getElementById('btn-show-formatted');
    const treeBtn = document.getElementById('btn-show-tree');
    const textOutput = document.getElementById('json-text-output');
    const treeOutput = document.getElementById('json-tree-container');

    if (type === 'formatted') {
      formattedBtn.classList.add('active');
      treeBtn.classList.remove('active');
      textOutput.style.display = 'block';
      treeOutput.style.display = 'none';
    } else {
      formattedBtn.classList.remove('active');
      treeBtn.classList.add('active');
      textOutput.style.display = 'none';
      treeOutput.style.display = 'block';
    }
  }

  function renderJsonTreeVisual(obj) {
    const container = document.getElementById('json-tree-container');
    function createNode(key, value, isLast) {
      const li = document.createElement('li');
      li.className = 'json-tree-node';
      const isObject = value !== null && typeof value === 'object';
      const type = typeof value;
      const keySpan = document.createElement('span');
      keySpan.className = 'json-tree-key';
      keySpan.textContent = key !== null ? `"${key}": ` : '';
      li.appendChild(keySpan);

      if (isObject) {
        const isArray = Array.isArray(value);
        const openChar = isArray ? '[' : '{';
        const closeChar = isArray ? ']' : '}';
        const count = Object.keys(value).length;
        const toggle = document.createElement('span');
        toggle.className = 'json-tree-toggle';
        toggle.textContent = '▼ ';
        toggle.onclick = (e) => {
          e.stopPropagation();
          const children = li.querySelector('.json-tree-children');
          if (children.style.display === 'none') {
            children.style.display = 'block';
            toggle.textContent = '▼ ';
          } else {
            children.style.display = 'none';
            toggle.textContent = '▶ ';
          }
        };
        li.insertBefore(toggle, keySpan);

        const openSpan = document.createElement('span');
        openSpan.className = 'json-tree-bracket';
        openSpan.textContent = `${openChar} /* ${count} items */`;
        li.appendChild(openSpan);

        const childrenUl = document.createElement('ul');
        childrenUl.className = 'json-tree-children';
        childrenUl.style.paddingLeft = '15px';
        childrenUl.style.listStyle = 'none';

        const keys = Object.keys(value);
        keys.forEach((k, idx) => {
          childrenUl.appendChild(createNode(k, value[k], idx === keys.length - 1));
        });
        li.appendChild(childrenUl);

        const closeSpan = document.createElement('span');
        closeSpan.className = 'json-tree-bracket';
        closeSpan.textContent = closeChar + (isLast ? '' : ',');
        li.appendChild(closeSpan);
      } else {
        const valueSpan = document.createElement('span');
        valueSpan.className = `json-tree-value json-tree-${type}`;
        valueSpan.textContent = type === 'string' ? `"${value}"` : String(value);
        li.appendChild(valueSpan);
        if (!isLast) {
          const comma = document.createElement('span');
          comma.textContent = ',';
          li.appendChild(comma);
        }
      }
      return li;
    }
    container.innerHTML = '';
    const rootUl = document.createElement('ul');
    rootUl.className = 'json-tree-root';
    rootUl.style.listStyle = 'none';
    rootUl.appendChild(createNode(null, obj, true));
    container.appendChild(rootUl);
  }

  function checkPasswordStrength(password) {
    const fill = document.getElementById('pw-strength-fill');
    const label = document.getElementById('pw-strength-label');
    const entropyLabel = document.getElementById('pw-entropy');
    if (!password) {
      fill.style.width = '0%';
      label.innerText = 'None';
      entropyLabel.innerText = 'Entropy: 0 bits';
      return;
    }
    let pool = 0;
    if (/[a-z]/.test(password)) pool += 26;
    if (/[A-Z]/.test(password)) pool += 26;
    if (/[0-9]/.test(password)) pool += 10;
    if (/[^a-zA-Z0-9]/.test(password)) pool += 32;

    const entropy = Math.round(password.length * Math.log2(pool));
    entropyLabel.innerText = `Entropy: ${entropy} bits`;

    if (entropy < 40) {
      fill.style.width = '25%';
      fill.style.backgroundColor = 'var(--error)';
      label.innerText = 'Weak';
      label.style.color = 'var(--error)';
    } else if (entropy < 65) {
      fill.style.width = '50%';
      fill.style.backgroundColor = 'var(--warning)';
      label.innerText = 'Medium';
      label.style.color = 'var(--warning)';
    } else if (entropy < 85) {
      fill.style.width = '75%';
      fill.style.backgroundColor = 'var(--accent-light)';
      label.innerText = 'Strong';
      label.style.color = 'var(--accent-light)';
    } else {
      fill.style.width = '100%';
      fill.style.backgroundColor = 'var(--success)';
      label.innerText = 'Premium / Bulletproof';
      label.style.color = 'var(--success)';
    }
  }

  function hexToRgbStr(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgb(${r}, ${g}, ${b})`;
  }

  function adjustHue(hex, degree) {
    let r = parseInt(hex.slice(1, 3), 16) / 255;
    let g = parseInt(hex.slice(3, 5), 16) / 255;
    let b = parseInt(hex.slice(5, 7), 16) / 255;
    let max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if(max === min){ h = s = 0; } else {
      let d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch(max){
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h /= 6;
    }
    h = (h * 360 + degree) % 360;
    if(h < 0) h += 360;
    // convert hsl back to hex
    const hslToHex = (h, s, l) => {
      l /= 100; const a = s * Math.min(l, 1 - l) / 100;
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    };
    return hslToHex(h, s * 100, l * 100);
  }

  function shadeColor(color, percent) {
    let R = parseInt(color.substring(1,3),16);
    let G = parseInt(color.substring(3,5),16);
    let B = parseInt(color.substring(5,7),16);
    R = parseInt(R * (100 + percent) / 100);
    G = parseInt(G * (100 + percent) / 100);
    B = parseInt(B * (100 + percent) / 100);
    R = (R<255)?R:255; G = (G<255)?G:255; B = (B<255)?B:255;
    R = (R<0)?0:R; G = (G<0)?0:G; B = (B<0)?0:B;
    const rHex = R.toString(16).padStart(2, '0');
    const gHex = G.toString(16).padStart(2, '0');
    const bHex = B.toString(16).padStart(2, '0');
    return `#${rHex}${gHex}${bHex}`;
  }
