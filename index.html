  <style>
    :root {
      --font-mono: 'Fira Code', 'Courier New', Courier, monospace;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Dark Default Theme */
      --bg-primary: #09090b;
      --bg-secondary: #121214;
      --bg-tertiary: #1c1c1f;
      --bg-card: #18181b;
      --border: #27272a;
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --glass: rgba(18, 18, 20, 0.7);
      --blur: 16px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    [data-theme="light"] {
      --bg-primary: #f4f4f5;
      --bg-secondary: #ffffff;
      --bg-tertiary: #e4e4e7;
      --bg-card: #ffffff;
      --border: #e4e4e7;
      --text-primary: #09090b;
      --text-secondary: #71717a;
      --accent: #4f46e5;
      --accent-light: #6366f1;
      --accent-gradient: linear-gradient(135deg, #4f46e5, #9333ea);
      --glass: rgba(255, 255, 255, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    /* Core Layout */
    .app-container {
      display: flex;
      flex: 1;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Side Navigation (Desktop) */
    .side-nav {
      width: 260px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
      z-index: 50;
    }

    @media (max-width: 768px) {
      .side-nav {
        display: none;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.25rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2rem;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      list-style: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-primary);
      background-color: var(--border);
    }

    .nav-item.active {
      background: var(--accent-gradient);
      color: white;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }

    /* Bottom Navigation (Mobile) */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background-color: var(--glass);
      backdrop-filter: blur(var(--blur));
      border-top: 1px solid var(--border);
      z-index: 100;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (max-width: 768px) {
      .bottom-nav {
        display: flex;
      }
    }

    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .bottom-nav-item.active {
      color: var(--accent-light);
    }

    .bottom-nav-item svg {
      width: 20px;
      height: 20px;
    }

    /* Main Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding-bottom: 80px; /* offset for bottom nav on mobile */
    }

    @media (min-width: 769px) {
      .main-content {
        padding-bottom: 0;
      }
    }

    /* Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background-color: var(--glass);
      backdrop-filter: blur(var(--blur));
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .search-container {
      position: relative;
      width: 100%;
      max-width: 480px;
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .search-container svg {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 0.5rem;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      color: var(--text-primary);
      background-color: var(--border);
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
    }

    /* Home View Elements */
    .view-section {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero */
    .hero-banner {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem 2rem;
      margin-bottom: 2.5rem;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .hero-banner::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    .hero-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .hero-sub {
      font-size: 1.1rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Animated Rotating Message */
    .rotating-wrapper {
      height: 2rem;
      overflow: hidden;
      position: relative;
    }

    .rotating-text {
      position: absolute;
      font-weight: 600;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .rotating-text.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .stat-icon {
      background: rgba(99, 102, 241, 0.1);
      color: var(--accent-light);
      padding: 0.75rem;
      border-radius: 8px;
    }

    .stat-icon svg {
      width: 24px;
      height: 24px;
    }

    .stat-val {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Categories Selector */
    .category-scroll {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-pill {
      white-space: nowrap;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background-color: var(--bg-card);
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-pill:hover, .category-pill.active {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .category-pill.active {
      background-color: var(--accent);
      color: white;
    }

    /* Tools Grid */
    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 3rem;
    }

    .tool-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      position: relative;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      justify-content: space-between;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: var(--shadow-lg);
    }

    .tool-meta {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .tool-icon {
      background-color: var(--bg-primary);
      padding: 0.6rem;
      border-radius: 8px;
      color: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
    }

    .tool-icon svg {
      width: 20px;
      height: 20px;
    }

    .tool-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .tool-desc {
      font-size: 0.825rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .btn-fav {
      color: var(--text-secondary);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-fav:hover {
      background-color: var(--border);
    }

    .btn-fav.active {
      color: var(--error);
    }

    .btn-fav svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Core Tool Workspace Layout */
    .tool-workspace {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      animation: fadeIn 0.3s ease-out;
    }

    .tool-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .tool-actions-toolbar {
      display: flex;
      gap: 0.5rem;
    }

    .tool-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      border-color: var(--accent);
      background-color: var(--bg-tertiary);
    }

    .tool-btn-primary {
      background: var(--accent-gradient);
      border: none;
      color: white;
    }

    .tool-btn-primary:hover {
      opacity: 0.9;
    }

    .tool-grid-panels {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 992px) {
      .tool-grid-panels {
        grid-template-columns: 1fr 1fr;
      }
    }

    .panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-area, .output-area {
      width: 100%;
      min-height: 280px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }

    .input-area:focus, .output-area:focus {
      border-color: var(--accent);
    }

    /* Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-control {
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .checkbox-group input {
      accent-color: var(--accent);
    }

    /* Toast Notification System */
    .toast-container {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 1000;
      pointer-events: none;
    }

    .toast {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      color: var(--text-primary);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      font-weight: 500;
      pointer-events: auto;
      transform: translateX(120%);
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      max-width: 320px;
    }

    @keyframes slideIn {
      to { transform: translateX(0); }
    }

    .toast.error { border-left-color: var(--error); }
    .toast.success { border-left-color: var(--success); }

    /* Custom Modal Framework */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 90%;
      max-width: 540px;
      box-shadow: var(--shadow-lg);
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      max-height: 70vh;
      font-size: 0.925rem;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    /* JSON Tree styles */
    .json-tree-root { margin-top: 1rem; }
    .json-tree-node { margin: 4px 0; font-family: var(--font-mono); font-size: 0.85rem; }
    .json-tree-toggle { cursor: pointer; color: var(--accent-light); font-weight: bold; margin-right: 4px; user-select: none; }
    .json-tree-key { color: #f43f5e; font-weight: 500; }
    .json-tree-value.json-tree-string { color: #10b981; }
    .json-tree-value.json-tree-number { color: #3b82f6; }
    .json-tree-value.json-tree-boolean { color: #f59e0b; }
    .json-tree-value.json-tree-null { color: #6b7280; }

    /* Flexbox generator layout playground */
    .flexbox-playground {
      width: 100%;
      height: 200px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      padding: 8px;
      gap: 8px;
      overflow: hidden;
    }

    .flex-play-item {
      background: var(--accent-gradient);
      width: 50px;
      height: 50px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
    }

    /* Strength meter */
    .strength-bar {
      height: 6px;
      border-radius: 3px;
      background-color: var(--border);
      overflow: hidden;
      margin-top: 4px;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    /* Skeleton animations */
    .skeleton-line {
      height: 16px;
      background: linear-gradient(90deg, var(--border) 25%, var(--bg-tertiary) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: 4px;
      width: 100%;
    }

    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Diff Checker colors */
    .diff-container {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      white-space: pre-wrap;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
    }
    .diff-line { display: block; padding: 2px 4px; }
    .diff-added { background-color: rgba(16, 185, 129, 0.15); color: #10b981; }
    .diff-removed { background-color: rgba(239, 68, 68, 0.15); color: #ef4444; }

<script>
  /************************************************************************

    stats: JSON.parse(localStorage.getItem('wydev_stats') || '{"runs": 0, "clicks": 0}'),
    theme: localStorage.getItem('wydev_theme') || 'dark',
    activeCategory: 'all'

  const LIBS = {
    qrcode: 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',

    forge: 'https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js',
    paystack: 'https://js.paystack.co/v1/inline.js'
  };

  const CATEGORIES = [
    { id: 'all', name: 'All Tools', icon: '⚡' },
    { id: 'code', name: 'Code Formatters', icon: '💻' },
    { id: 'security', name: 'Security & Crypto', icon: '🛡️' },

    { id: 'web', name: 'Web & PWA Dev', icon: '🌐' },
    { id: 'datetime', name: 'Date & Clock', icon: '⏰' }
  ];

  // Premium tools are unlocked with a single one-off Paystack payment. The amount is
  // enforced server-side too (see /api/verify-payment.js) - changing it here alone
  // does not change what a customer is actually charged.
  const PAYMENT_CONFIG = {
    amountKobo: 350000, // NGN 3,500.00 (Paystack amounts are in kobo)
    currency: 'NGN',
    displayAmount: '\u20a63,500',
    premiumToolIds: ['keystore-generator', 'jwt-decoder', 'password-generator']
  };

  /************************************************************************
   * Premium Access (Paystack) - state, checkout, verification, sync
   ************************************************************************/
  let _cachedPaystackPublicKey = null;

  function isPremiumTool(toolId) {
    return PAYMENT_CONFIG.premiumToolIds.includes(toolId);
  }

  function getPremiumState() {
    try {
      return JSON.parse(localStorage.getItem('wydev_premium') || 'null');
    } catch (e) {
      return null;
    }
  }

  function setPremiumState(state) {
    localStorage.setItem('wydev_premium', JSON.stringify(state));
  }

  function hasPremiumAccess() {
    const state = getPremiumState();
    return !!(state && state.unlocked);
  }

  async function fetchPaystackPublicKey() {
    if (_cachedPaystackPublicKey) return _cachedPaystackPublicKey;
    const res = await fetch('/api/config');
    if (!res.ok) throw new Error('Could not load payment configuration');
    const data = await res.json();
    if (!data.publicKey) throw new Error('Payment configuration is incomplete');
    _cachedPaystackPublicKey = data.publicKey;
    return _cachedPaystackPublicKey;
  }

  function generatePaymentReference() {
    return `wydev_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
  }

  async function startPremiumCheckout(afterUnlockToolId) {
    const existing = getPremiumState();
    const emailInput = window.prompt('Enter your email address for the receipt and to sync your unlock across devices:', existing && existing.email ? existing.email : '');
    if (!emailInput) return;
    const email = emailInput.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) {
      showToast('Enter a valid email address', 'error');
      return;
    }

    showToast('Loading secure payment...', 'success');
    let publicKey;
    try {
      publicKey = await fetchPaystackPublicKey();
      await loadExternalLib('paystack');
    } catch (e) {
      showToast(e.message || 'Could not start payment', 'error');
      return;
    }

    if (!window.PaystackPop) {
      showToast('Payment engine failed to load. Check your connection and try again.', 'error');
      return;
    }

    const handler = window.PaystackPop.setup({
      key: publicKey,
      email: email,
      amount: PAYMENT_CONFIG.amountKobo,
      currency: PAYMENT_CONFIG.currency,
      ref: generatePaymentReference(),
      metadata: { unlock: 'wydev_premium_tools' },
      callback: function (response) {
        verifyPremiumPayment(response.reference, afterUnlockToolId);
      },
      onClose: function () {
        showToast('Payment window closed', 'error');
      }
    });
    handler.openIframe();
  }

  async function verifyPremiumPayment(reference, afterUnlockToolId) {
    showToast('Confirming your payment...', 'success');
    try {
      const res = await fetch('/api/verify-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reference })
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        setPremiumState({ unlocked: true, email: data.email, reference: data.reference, verifiedAt: Date.now() });
        showToast('Premium tools unlocked. Thank you!', 'success');
        if (afterUnlockToolId) {
          renderTool(afterUnlockToolId);
        } else {
          renderCurrentRoute();
        }
      } else {
        showToast(data.error || 'Payment could not be verified', 'error');
      }
    } catch (e) {
      showToast('Could not reach the server to verify payment', 'error');
    }
  }

  async function restorePremiumAccess() {
    const existing = getPremiumState();
    const emailInput = window.prompt('Enter the email address you paid with:', existing && existing.email ? existing.email : '');
    if (!emailInput) return;
    const email = emailInput.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) {
      showToast('Enter a valid email address', 'error');
      return;
    }
    showToast('Checking your purchase history...', 'success');
    try {
      const res = await fetch(`/api/check-access?email=${encodeURIComponent(email)}`);
      const data = await res.json();
      if (res.ok && data.unlocked) {
        setPremiumState({ unlocked: true, email: email, reference: data.reference, verifiedAt: Date.now() });
        showToast('Premium access restored', 'success');
        renderCurrentRoute();
      } else {
        showToast('No successful payment found for that email', 'error');
      }
    } catch (e) {
      showToast('Could not reach the server to check access', 'error');
    }
  }

  /************************************************************************
   * Core Helper Utilities (Toasts, Modals, Loading, Local Processing MD5)
   ************************************************************************/
  function showToast(message, type = 'success') {
    const wrapper = document.getElementById('toast-wrapper');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:18px;height:18px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>${message}</span>
    `;
    wrapper.appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'none';
      toast.style.transform = 'translateX(120%)';
      setTimeout(() => toast.remove(), 300);
    }, 2500);
  }

  function showModal(title, bodyHtml) {
    document.getElementById('modal-title-target').innerText = title;
    document.getElementById('modal-body-target').innerHTML = bodyHtml;
    document.getElementById('global-modal-overlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('global-modal-overlay').classList.remove('active');
  }

  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
  document.getElementById('global-modal-overlay').addEventListener('click', (e) => {
    if(e.target.id === 'global-modal-overlay') closeModal();
  });

  function saveStat(key) {
    State.stats[key] = (State.stats[key] || 0) + 1;
    localStorage.setItem('wydev_stats', JSON.stringify(State.stats));
  }

  function toggleFavorite(id, event) {
    if (event) event.stopPropagation();
    const idx = State.favorites.indexOf(id);
    if(idx > -1) {
      State.favorites.splice(idx, 1);
      showToast("Removed from favorites", "success");
    } else {
      State.favorites.push(id);
      showToast("Added to favorites", "success");
    }
    localStorage.setItem('wydev_favorites', JSON.stringify(State.favorites));
    renderCurrentRoute();
  }

  /************************************************************************
   * Universal Download Helpers (Blob API)
   ************************************************************************/
  // Triggers a browser download for any string/Uint8Array/Blob payload.
  function downloadBlob(filename, data, mimeType = 'application/octet-stream') {
    const blob = (data instanceof Blob) ? data : new Blob([data], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    // Release the object URL after the click has been processed.
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Generic multi-page monospace text-to-PDF exporter (jsPDF), built on Blob output.
  async function exportTextAsPDF(docTitle, bodyText, filename, coloredLines = null) {
    await loadExternalLib('jspdf');
    if (!window.jspdf || !window.jspdf.jsPDF) {
      showToast('Failed to load PDF engine', 'error');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    const marginX = 40;
    let cursorY = 50;
    const pageHeight = doc.internal.pageSize.getHeight();
    const pageWidth = doc.internal.pageSize.getWidth();
    const maxLineWidth = pageWidth - marginX * 2;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text(docTitle, marginX, cursorY);
    cursorY += 14;
    doc.setFont('courier', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(140, 140, 140);
    doc.text(`Generated locally by WyDev - ${new Date().toLocaleString()}`, marginX, cursorY);
    cursorY += 24;

    doc.setFontSize(9.5);

    const rawLines = coloredLines || bodyText.split('\n').map(l => ({ text: l, color: [30, 30, 30] }));

    rawLines.forEach(entry => {
      const wrapped = doc.splitTextToSize(entry.text.length ? entry.text : ' ', maxLineWidth);
      wrapped.forEach(wLine => {
        if (cursorY > pageHeight - 40) {
          doc.addPage();
          cursorY = 50;
        }
        doc.setTextColor(entry.color[0], entry.color[1], entry.color[2]);
        doc.text(wLine, marginX, cursorY);
        cursorY += 12;
      });
    });

    const blob = doc.output('blob');
    downloadBlob(filename, blob, 'application/pdf');
    showToast('PDF exported successfully', 'success');
  }

  // Draws real filled color swatches into the PDF so the export visually matches the palette.
  async function exportColorPaletteAsPDF(seedHex, analogousColors, monoColors) {
    await loadExternalLib('jspdf');
    if (!window.jspdf || !window.jspdf.jsPDF) {
      showToast('Failed to load PDF engine', 'error');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    const marginX = 40;
    let cursorY = 50;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text('WyDev - Color Palette Report', marginX, cursorY);
    cursorY += 18;
    doc.setFont('courier', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(140, 140, 140);
    doc.text(`Seed color: ${seedHex} - Generated locally by WyDev - ${new Date().toLocaleString()}`, marginX, cursorY);
    cursorY += 30;

    const swatchSize = 70;
    const gap = 16;

    const drawRow = (label, colors) => {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor(20, 20, 20);
      doc.text(label, marginX, cursorY);
      cursorY += 12;
      colors.forEach((hex, idx) => {
        const x = marginX + idx * (swatchSize + gap);
        const rgb = [
          parseInt(hex.slice(1, 3), 16),
          parseInt(hex.slice(3, 5), 16),
          parseInt(hex.slice(5, 7), 16)
        ];
        doc.setFillColor(rgb[0], rgb[1], rgb[2]);
        doc.roundedRect(x, cursorY, swatchSize, swatchSize, 6, 6, 'F');
        doc.setDrawColor(200, 200, 200);
        doc.roundedRect(x, cursorY, swatchSize, swatchSize, 6, 6, 'S');
        doc.setFont('courier', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(30, 30, 30);
        doc.text(hex.toUpperCase(), x, cursorY + swatchSize + 14);
      });
      cursorY += swatchSize + 40;
    };

    drawRow('Analogous Palette', analogousColors);
    drawRow('Monochromatic Shading', monoColors);

    const blob = doc.output('blob');
    downloadBlob('color-palette-report.pdf', blob, 'application/pdf');
    showToast('PDF exported successfully', 'success');
  }

  // Reads a File object as a base64 string (chunked, safe for large files).
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        // result is a data URL: "data:<mime>;base64,<data>"
        const commaIdx = reader.result.indexOf(',');
        resolve({ base64: reader.result.slice(commaIdx + 1), mimeType: file.type || 'application/octet-stream' });
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  // Converts a base64 string back into a Uint8Array of raw bytes.
  function base64ToBytes(base64String) {
    const cleaned = base64String.replace(/\s/g, '');
    const binaryStr = atob(cleaned);
    const bytes = new Uint8Array(binaryStr.length);
    for (let i = 0; i < binaryStr.length; i++) {
      bytes[i] = binaryStr.charCodeAt(i);
    }
    return bytes;
  }

  function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return `${(bytes / Math.pow(1024, i)).toFixed(2)} ${units[i]}`;
  }

    function ConvertToWordArray(string) {

  function navigateTo(hash) {
    window.location.hash = hash;
  }

  window.addEventListener('hashchange', renderCurrentRoute);

  function renderCurrentRoute() {
    const hash = window.location.hash || '#home';
    const viewName = hash.split('/')[0];

    // Reset views states navigation highlights
    document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
      el.classList.remove('active');
      if (el.getAttribute('href') === viewName) {
        el.classList.add('active');
      }
    });

    if (viewName === '#home') {
      renderHome();
    } else if (viewName === '#settings') {
      renderSettings();
    } else if (viewName === '#about') {
      renderAbout();
    } else if (viewName.startsWith('#tool-')) {
      const toolId = viewName.replace('#tool-', '');
      renderTool(toolId);
    }
  }

  // Filter tools based on Search Input & Category
  function getFilteredTools() {
    const searchVal = document.getElementById('global-search').value.toLowerCase().trim();
    const cat = State.activeCategory;

    return TOOLS.filter(t => {
      const matchesSearch = t.name.toLowerCase().includes(searchVal) || 
                            t.description.toLowerCase().includes(searchVal) ||
                            t.keywords.toLowerCase().includes(searchVal);
      const matchesCategory = (cat === 'all' || t.category === cat);
      return matchesSearch && matchesCategory;
    });
  }

  const bannerPhrases = [

    "Productivity Starts Here."
  ];
  let rotateIdx = 0;
  let phraseInterval = null;

  function initHeroAnimation() {
    if (phraseInterval) clearInterval(phraseInterval);
    const target = document.getElementById('rotate-txt');
    if (!target) return;
    phraseInterval = setInterval(() => {
      rotateIdx = (rotateIdx + 1) % bannerPhrases.length;
      target.style.opacity = '0';
      target.style.transform = 'translateY(-10px)';
      setTimeout(() => {
        target.innerText = bannerPhrases[rotateIdx];
        target.style.transform = 'translateY(10px)';
        setTimeout(() => {
          target.style.opacity = '1';
          target.style.transform = 'translateY(0)';
        }, 50);
      }, 250);
    }, 3000);
  }

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const newTheme = State.theme === 'dark' ? 'light' : 'dark';
    changeTheme(newTheme);
  });

  function changeTheme(themeVal) {
    State.theme = themeVal;
    localStorage.setItem('wydev_theme', themeVal);
    document.documentElement.setAttribute('data-theme', themeVal);
    showToast(`Switched to theme: ${themeVal}`, 'success');
  }

  function clearAppData() {
    localStorage.clear();
    showToast("Application data reset completed", "success");
    setTimeout(() => window.location.reload(), 1000);
  }

  /************************************************************************
   * Tools Logical Interactions Hub
   ************************************************************************/
  async function executeToolAction(toolId, action) {
    saveStat('runs');
    document.getElementById('stat-runs-num') ? document.getElementById('stat-runs-num').innerText = State.stats.runs : null;

    if (toolId === 'json-formatter') {
      const inputEl = document.getElementById('json-input');
      const textOutputEl = document.getElementById('json-text-output');
      if (action === 'example') {
        inputEl.value = JSON.stringify({ name: "WyDev", version: 1.0, active: true, config: { engine: "Local" }, tools: ["JSON Formatter", "Base64 Encoder", "Secure Passwords"] }, null, 2);
        showToast("Loaded example payload", "success");
      } else if (action === 'clear') {
        inputEl.value = '';
        textOutputEl.value = '';
        document.getElementById('json-tree-container').innerHTML = '';
        showToast("Inputs cleared", "success");
      } else if (action === 'format') {
        try {
          const parsed = JSON.parse(inputEl.value);
          textOutputEl.value = JSON.stringify(parsed, null, 2);
          renderJsonTreeVisual(parsed);
          showToast("Successfully formatted JSON!", "success");
        } catch (e) {
          showToast(`Error parsing: ${e.message}`, 'error');
        }
      } else if (action === 'minify') {
        try {
          const parsed = JSON.parse(inputEl.value);
          textOutputEl.value = JSON.stringify(parsed);
          showToast("Successfully minified JSON!", "success");
        } catch (e) {
          showToast(`Error parsing: ${e.message}`, 'error');
        }
      } else if (action === 'copy') {
        navigator.clipboard.writeText(textOutputEl.value);
        showToast("Copied to clipboard!", "success");
      } else if (action === 'download-json') {
        if (!textOutputEl.value) { showToast("Format some JSON first", "error"); return; }
        downloadBlob('formatted.json', textOutputEl.value, 'application/json');
        showToast("Downloaded formatted.json", "success");
      } else if (action === 'download-pdf') {
        if (!textOutputEl.value) { showToast("Format some JSON first", "error"); return; }
        await exportTextAsPDF('WyDev - JSON Formatter Report', textOutputEl.value, 'json-report.pdf');
      }
    }

    else if (toolId === 'base64-converter') {
      const input = document.getElementById('base64-input').value;
      const output = document.getElementById('base64-output');
      const fileInput = document.getElementById('base64-file-input');

      if (action === 'example') {
        document.getElementById('base64-input').value = "WyDev local engine execution platform";
        showToast("Loaded example text", "success");
      } else if (action === 'clear') {
        document.getElementById('base64-input').value = '';
        output.value = '';
        fileInput.value = '';
        document.getElementById('base64-file-meta').innerText = '';
        showToast("Inputs cleared", "success");
      } else if (action === 'encode') {
        if (!input) { showToast("Enter some text first", "error"); return; }
        output.value = btoa(unescape(encodeURIComponent(input)));
        showToast("Encoded to Base64", "success");
      } else if (action === 'decode') {
        try {
          output.value = decodeURIComponent(escape(atob(input)));
          showToast("Decoded Base64 string", "success");
        } catch(e) {
          showToast("Invalid Base64 sequence", "error");
        }
      } else if (action === 'encode-file') {
        const file = fileInput.files[0];
        if (!file) { showToast("Choose a file first", "error"); return; }
        try {
          const { base64, mimeType } = await fileToBase64(file);
          output.value = base64;
          output.dataset.sourceMime = mimeType;
          output.dataset.sourceName = file.name;
          showToast(`Encoded ${file.name} (${formatBytes(file.size)}) to Base64`, "success");
        } catch (e) {
          showToast(`Failed to read file: ${e.message}`, "error");
        }
      } else if (action === 'decode-to-file') {
        const raw = output.value.trim() || input.trim();
        if (!raw) { showToast("No Base64 data to decode", "error"); return; }
        try {
          const bytes = base64ToBytes(raw);
          const mimeType = output.dataset.sourceMime || 'application/octet-stream';
          const suggestedName = output.dataset.sourceName ? `decoded-${output.dataset.sourceName}` : 'decoded-file.bin';
          downloadBlob(suggestedName, bytes, mimeType);
          showToast(`Downloaded ${suggestedName} (${formatBytes(bytes.length)})`, "success");
        } catch (e) {
          showToast("Invalid Base64 sequence, cannot decode to file", "error");
        }
      } else if (action === 'copy') {
        navigator.clipboard.writeText(output.value);
        showToast("Copied to clipboard!", "success");
      } else if (action === 'download-txt') {
        if (!output.value) { showToast("Nothing to download yet", "error"); return; }
        downloadBlob('base64-output.txt', output.value, 'text/plain');
        showToast("Downloaded base64-output.txt", "success");
      } else if (action === 'download-pdf') {
        if (!output.value) { showToast("Nothing to export yet", "error"); return; }
        await exportTextAsPDF('WyDev - Base64 Conversion Report', output.value, 'base64-report.pdf');
      }
    }

    else if (toolId === 'password-generator') {
      const output = document.getElementById('pw-output');
      if (action === 'generate') {
        const len = parseInt(document.getElementById('pw-length').value);
        const upper = document.getElementById('pw-upper').checked;
        const lower = document.getElementById('pw-lower').checked;
        const nums = document.getElementById('pw-numbers').checked;
        const syms = document.getElementById('pw-symbols').checked;
        
        let chars = '';
        if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        if (lower) chars += 'abcdefghijklmnopqrstuvwxyz';
        if (nums) chars += '0123456789';
        if (syms) chars += '!@#$%^&*()_+~`|}{[]:;?><,./-';

        if (!chars) {
          showToast("Please choose at least one character type", "error");
          return;
        }

        let pass = '';
        const cryptoObj = window.crypto || window.msCrypto;
        const randomValues = new Uint32Array(len);
        cryptoObj.getRandomValues(randomValues);
        for(let i=0; i<len; i++) {
          pass += chars[randomValues[i] % chars.length];
        }
        output.value = pass;
        checkPasswordStrength(pass);
        showToast("Password successfully generated", "success");
      } else if (action === 'copy') {
        navigator.clipboard.writeText(output.value);
        showToast("Copied to clipboard!", "success");
      }
    }

    else if (toolId === 'jwt-decoder') {
      const input = document.getElementById('jwt-input').value.trim();
      if(action === 'example') {
        document.getElementById('jwt-input').value = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyLCJleHAiOjE5MjQ5MDU2MDB9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c";
        showToast("Loaded example JWT", "success");
      } else if (action === 'clear') {
        document.getElementById('jwt-input').value = '';
        document.getElementById('jwt-header').innerText = '';
        document.getElementById('jwt-payload').innerText = '';
        document.getElementById('jwt-meta-box').style.display = 'none';
        showToast("Inputs cleared", "success");
      } else if (action === 'decode') {
        const parts = input.split('.');
        if (parts.length !== 3) {
          showToast("Invalid JWT structure", "error");
          return;
        }
        try {
          const header = JSON.parse(atob(parts[0]));
          const payload = JSON.parse(atob(parts[1]));
          document.getElementById('jwt-header').innerText = JSON.stringify(header, null, 2);
          document.getElementById('jwt-payload').innerText = JSON.stringify(payload, null, 2);
          
          const metaBox = document.getElementById('jwt-meta-box');
          const expStatus = document.getElementById('jwt-exp-status');
          metaBox.style.display = 'block';

          if (payload.exp) {
            const expDate = new Date(payload.exp * 1000);
            const isExpired = expDate < new Date();
            expStatus.innerText = isExpired ? `Expired on ${expDate.toLocaleString()}` : `Valid until ${expDate.toLocaleString()}`;
            expStatus.style.color = isExpired ? 'var(--error)' : 'var(--success)';
          } else {
            expStatus.innerText = "No expiration claim ('exp') found.";
            expStatus.style.color = 'var(--warning)';
          }
          showToast("Token decoded successfully", "success");
        } catch (e) {
          showToast("Failed to decode base64 claims", "error");
        }
      } else if (action === 'download-pdf') {
        const headerText = document.getElementById('jwt-header').innerText;
        const payloadText = document.getElementById('jwt-payload').innerText;
        if (!headerText && !payloadText) { showToast("Decode a token first", "error"); return; }
        const report = `HEADER\n------\n${headerText}\n\nPAYLOAD\n-------\n${payloadText}`;
        await exportTextAsPDF('WyDev - JWT Inspection Report', report, 'jwt-report.pdf');
      }
    }

    else if (toolId === 'color-palette') {
      const hexInput = document.getElementById('color-hex').value;
      if (action === 'generate') {
        const hex = hexInput.startsWith('#') ? hexInput : '#' + hexInput;
        document.getElementById('color-picker-input').value = hex;
        
        // Generate Schemes
        const analogousColors = [
          adjustHue(hex, -30),
          hex,
          adjustHue(hex, 30)
        ];
        const monoColors = [
          shadeColor(hex, 20),
          hex,
          shadeColor(hex, -20)
        ];

        document.getElementById('pallet-row-analogous').innerHTML = analogousColors.map(c => `
          <div style="background-color: ${c}; height: 50px; flex: 1; border-radius: 6px; cursor: pointer; border: 1px solid var(--border);" onclick="navigator.clipboard.writeText('${c}'); showToast('Copied ${c}', 'success')" title="Click to copy"></div>
        `).join('');

        document.getElementById('pallet-row-mono').innerHTML = monoColors.map(c => `
          <div style="background-color: ${c}; height: 50px; flex: 1; border-radius: 6px; cursor: pointer; border: 1px solid var(--border);" onclick="navigator.clipboard.writeText('${c}'); showToast('Copied ${c}', 'success')" title="Click to copy"></div>
        `).join('');

        showToast("Schemes generated locally", "success");
      } else if (action === 'download-pdf') {
        const hex = hexInput.startsWith('#') ? hexInput : '#' + hexInput;
        const analogousColors = [adjustHue(hex, -30), hex, adjustHue(hex, 30)];
        const monoColors = [shadeColor(hex, 20), hex, shadeColor(hex, -20)];
        await exportColorPaletteAsPDF(hex, analogousColors, monoColors);
      }
    }

    else if (toolId === 'flexbox-generator') {
      const code = document.getElementById('flex-css-code').value;
      if (action === 'copy') {
        navigator.clipboard.writeText(code);
        showToast("Copied CSS to clipboard", "success");
      } else if (action === 'download-pdf') {
        await exportTextAsPDF('WyDev - Flexbox CSS Export', code, 'flexbox-css.pdf');
      }
    }

    else if (toolId === 'text-diff') {
      const textA = document.getElementById('diff-text-a').value;
      const textB = document.getElementById('diff-text-b').value;
      const target = document.getElementById('diff-results-board');

      if (action === 'example') {
        document.getElementById('diff-text-a').value = "const val = 1;\nconsole.log(val);\nprocess.exit(0);";
        document.getElementById('diff-text-b').value = "const val = 2;\nconsole.log('val:', val);\nprocess.exit(1);";
        showToast("Loaded examples", "success");
      } else if (action === 'clear') {
        document.getElementById('diff-text-a').value = '';
        document.getElementById('diff-text-b').value = '';
        target.innerHTML = 'Differences visual state shows here...';
        showToast("Inputs cleared", "success");
      } else if (action === 'compare') {
        const linesA = textA.split('\n');
        const linesB = textB.split('\n');
        let diffHtml = '';
        const pdfLines = [];
        const max = Math.max(linesA.length, linesB.length);
        for(let i=0; i<max; i++) {
          if (linesA[i] === linesB[i]) {
            diffHtml += `<span class="diff-line">${linesA[i] || ''}</span>`;
            pdfLines.push({ text: `  ${linesA[i] || ''}`, color: [90, 90, 90] });
          } else {
            if (linesA[i] !== undefined) {
              diffHtml += `<span class="diff-line diff-removed">- ${linesA[i]}</span>`;
              pdfLines.push({ text: `- ${linesA[i]}`, color: [220, 38, 38] });
            }
            if (linesB[i] !== undefined) {
              diffHtml += `<span class="diff-line diff-added">+ ${linesB[i]}</span>`;
              pdfLines.push({ text: `+ ${linesB[i]}`, color: [16, 185, 129] });
            }
          }
        }
        target.innerHTML = diffHtml || "Inputs match exactly.";
        target.dataset.pdfLines = JSON.stringify(pdfLines);
        showToast("Diff checks complete", "success");
      } else if (action === 'download-pdf') {
        const stored = target.dataset.pdfLines;
        if (!stored) { showToast("Run a comparison first", "error"); return; }
        const pdfLines = JSON.parse(stored);
        await exportTextAsPDF('WyDev - Text Diff Report', '', 'text-diff-report.pdf', pdfLines);
      }
    }

    else if (toolId === 'markdown-preview') {
      const input = document.getElementById('md-editor').value;
      if (action === 'example') {
        document.getElementById('md-editor').value = `# WyDev Live Compiler\n\n- Local sandbox\n- **Fast execution**\n- Beautiful responsive themes\n\n\`\`\`javascript\nconst isSecure = true;\n\`\`\``;
        document.getElementById('md-editor').dispatchEvent(new Event('input'));
        showToast("Loaded Markdown template", "success");
      } else if (action === 'clear') {
        document.getElementById('md-editor').value = '';
        document.getElementById('md-preview-target').innerHTML = 'Preview output appears here...';
        showToast("Inputs cleared", "success");
      } else if (action === 'export-html') {
        const preview = document.getElementById('md-preview-target').innerHTML;
        navigator.clipboard.writeText(preview);
        showToast("HTML elements copied!", "success");
      } else if (action === 'download-md') {
        if (!input) { showToast("Write some Markdown first", "error"); return; }
        downloadBlob('document.md', input, 'text/markdown');
        showToast("Downloaded document.md", "success");
      } else if (action === 'download-pdf') {
        if (!input) { showToast("Write some Markdown first", "error"); return; }
        await exportTextAsPDF('WyDev - Markdown Export', input, 'markdown-export.pdf');
      }
    }

    else if (toolId === 'qr-generator') {
      const payload = document.getElementById('qr-payload').value.trim();
      const outputCanvas = document.getElementById('qr-output-canvas');
      if (action === 'example') {
        document.getElementById('qr-payload').value = "https://github.com/github";
        showToast("Loaded example URL", "success");
      } else if (action === 'clear') {
        document.getElementById('qr-payload').value = '';
        outputCanvas.innerHTML = '';
        showToast("Inputs cleared", "success");
      } else if (action === 'build') {
        if (!payload) {
          showToast("Please provide a valid payload target", "error");
          return;
        }
        await loadExternalLib('qrcode');
        if (window.QRCode) {
          outputCanvas.innerHTML = '';
          new QRCode(outputCanvas, {
            text: payload,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff"
          });
          showToast("QR code visual state generated successfully", "success");
        } else {
          showToast("Failed to load QR generator engine", "error");
        }
      } else if (action === 'download-png' || action === 'download-pdf') {
        const canvasEl = outputCanvas.querySelector('canvas');
        const imgEl = outputCanvas.querySelector('img');
        let dataUrl = null;
        if (canvasEl) {
          dataUrl = canvasEl.toDataURL('image/png');
        } else if (imgEl && imgEl.src) {
          dataUrl = imgEl.src;
        }
        if (!dataUrl) { showToast("Generate a QR code first", "error"); return; }

        if (action === 'download-png') {
          const res = await fetch(dataUrl);
          const blob = await res.blob();
          downloadBlob('qr-code.png', blob, 'image/png');
          showToast("Downloaded qr-code.png", "success");
        } else {
          await loadExternalLib('jspdf');
          if (!window.jspdf || !window.jspdf.jsPDF) { showToast('Failed to load PDF engine', 'error'); return; }
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ unit: 'pt', format: 'a4' });
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(16);
          doc.text('WyDev - QR Code Export', 40, 50);
          doc.setFont('courier', 'normal');
          doc.setFontSize(9);
          doc.setTextColor(140, 140, 140);
          doc.text(`Generated locally by WyDev - ${new Date().toLocaleString()}`, 40, 68);
          doc.addImage(dataUrl, 'PNG', 40, 90, 200, 200);
          doc.setTextColor(30, 30, 30);
          doc.setFontSize(9.5);
          const wrappedPayload = doc.splitTextToSize(`Payload: ${payload}`, 500);
          doc.text(wrappedPayload, 40, 310);
          const blob = doc.output('blob');
          downloadBlob('qr-code-report.pdf', blob, 'application/pdf');
          showToast('PDF exported successfully', 'success');
        }
      }
    }

    else if (toolId === 'keystore-generator') {
      if (action === 'example') {
        document.getElementById('ks-alias').value = 'androidkey';
        document.getElementById('ks-cn').value = 'Jane Developer';
        document.getElementById('ks-ou').value = 'Engineering';
        document.getElementById('ks-o').value = 'My Company Inc';
        document.getElementById('ks-l').value = 'San Francisco';
        document.getElementById('ks-st').value = 'California';
        document.getElementById('ks-c').value = 'US';
        showToast('Loaded example certificate details', 'success');
      } else if (action === 'clear') {
        ['ks-alias','ks-cn','ks-ou','ks-o','ks-l','ks-st','ks-c','ks-store-pass','ks-key-pass'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('ks-result-box').style.display = 'none';
        document.getElementById('ks-result-empty').style.display = 'block';
        document.getElementById('ks-progress').innerText = '';
        lastKeystoreResult = null;
        showToast('Inputs cleared', 'success');
      } else if (action === 'generate') {
        const alias = document.getElementById('ks-alias').value.trim();
        const cn = document.getElementById('ks-cn').value.trim();
        const ou = document.getElementById('ks-ou').value.trim();
        const o = document.getElementById('ks-o').value.trim();
        const l = document.getElementById('ks-l').value.trim();
        const st = document.getElementById('ks-st').value.trim();
        const c = document.getElementById('ks-c').value.trim();
        const validityYears = parseInt(document.getElementById('ks-validity').value) || 25;
        const keySize = parseInt(document.getElementById('ks-keysize').value);
        const samePass = document.getElementById('ks-same-pass').checked;
        const storePass = document.getElementById('ks-store-pass').value;
        const keyPass = samePass ? storePass : document.getElementById('ks-key-pass').value;

        if (!alias || !/^[a-zA-Z0-9_-]+$/.test(alias)) {
          showToast('Alias is required (letters, numbers, - and _ only)', 'error'); return;
        }
        if (!cn) { showToast('Common Name (CN) is required', 'error'); return; }
        if (c && !/^[A-Za-z]{2}$/.test(c)) { showToast('Country code must be exactly 2 letters', 'error'); return; }
        if (!storePass || storePass.length < 6) { showToast('Keystore password must be at least 6 characters', 'error'); return; }
        if (!samePass && (!keyPass || keyPass.length < 6)) { showToast('Key password must be at least 6 characters', 'error'); return; }
        if (!samePass && keyPass !== storePass) {
          showToast('PKCS12 keystores require the same keystore and key password - enable "Use same password"', 'error');
          return;
        }

        const progress = document.getElementById('ks-progress');
        progress.innerText = 'Loading local crypto engine...';
        await loadExternalLib('forge');
        if (!window.forge) { showToast('Failed to load crypto engine', 'error'); progress.innerText = ''; return; }

        progress.innerText = `Generating ${keySize}-bit RSA key pair locally, this can take a few seconds...`;
        try {
          const keys = await new Promise((resolve, reject) => {
            forge.pki.rsa.generateKeyPair({ bits: keySize }, (err, kp) => {
              if (err) reject(err); else resolve(kp);
            });
          });

          progress.innerText = 'Building self-signed certificate...';
          const cert = forge.pki.createCertificate();
          cert.publicKey = keys.publicKey;
          cert.serialNumber = '01' + forge.util.bytesToHex(forge.random.getBytesSync(8));
          cert.validity.notBefore = new Date();
          cert.validity.notAfter = new Date();
          cert.validity.notAfter.setFullYear(cert.validity.notBefore.getFullYear() + validityYears);

          const attrs = [
            { name: 'commonName', value: cn },
            o ? { name: 'organizationName', value: o } : null,
            ou ? { shortName: 'OU', value: ou } : null,
            l ? { name: 'localityName', value: l } : null,
            st ? { shortName: 'ST', value: st } : null,
            c ? { name: 'countryName', value: c } : null
          ].filter(Boolean);

          cert.setSubject(attrs);
          cert.setIssuer(attrs);
          cert.setExtensions([
            { name: 'basicConstraints', cA: true },
            { name: 'keyUsage', keyCertSign: true, digitalSignature: true, keyEncipherment: true }
          ]);
          cert.sign(keys.privateKey, forge.md.sha256.create());

          progress.innerText = 'Packaging PKCS12 keystore...';
          const p12Asn1 = forge.pkcs12.toPkcs12Asn1(keys.privateKey, [cert], storePass, { algorithm: '3des', friendlyName: alias });
          const p12Der = forge.asn1.toDer(p12Asn1).getBytes();
          const p12Bytes = forgeBinaryToBytes(p12Der);

          const certDer = forge.asn1.toDer(forge.pki.certificateToAsn1(cert)).getBytes();
          const sha1Hex = forge.md.sha1.create().update(certDer).digest().toHex();
          const sha256Hex = forge.md.sha256.create().update(certDer).digest().toHex();

          lastKeystoreResult = {
            alias, cn, ou, o, l, st, c, validityYears, keySize,
            validUntil: cert.validity.notAfter.toLocaleDateString(),
            sha1: formatFingerprint(sha1Hex),
            sha256: formatFingerprint(sha256Hex),
            bytes: p12Bytes
          };

          document.getElementById('ks-out-alias').value = alias;
          document.getElementById('ks-out-validuntil').value = lastKeystoreResult.validUntil;
          document.getElementById('ks-out-sha1').value = lastKeystoreResult.sha1;
          document.getElementById('ks-out-sha256').value = lastKeystoreResult.sha256;
          document.getElementById('ks-result-empty').style.display = 'none';
          document.getElementById('ks-result-box').style.display = 'block';
          progress.innerText = 'Done. Nothing left this device.';
          showToast('Keystore generated successfully', 'success');
        } catch (e) {
          progress.innerText = '';
          showToast(`Keystore generation failed: ${e.message}`, 'error');
        }
      } else if (action === 'copy-sha1') {
        if (!lastKeystoreResult) { showToast('Generate a keystore first', 'error'); return; }
        navigator.clipboard.writeText(lastKeystoreResult.sha1);
        showToast('SHA-1 fingerprint copied', 'success');
      } else if (action === 'copy-sha256') {
        if (!lastKeystoreResult) { showToast('Generate a keystore first', 'error'); return; }
        navigator.clipboard.writeText(lastKeystoreResult.sha256);
        showToast('SHA-256 fingerprint copied', 'success');
      } else if (action === 'download-keystore') {
        if (!lastKeystoreResult) { showToast('Generate a keystore first', 'error'); return; }
        downloadBlob(`${lastKeystoreResult.alias}.keystore`, lastKeystoreResult.bytes, 'application/x-pkcs12');
        showToast(`Downloaded ${lastKeystoreResult.alias}.keystore`, 'success');
      } else if (action === 'download-pdf') {
        if (!lastKeystoreResult) { showToast('Generate a keystore first', 'error'); return; }
        const r = lastKeystoreResult;
        const report = [
          `Alias: ${r.alias}`,
          `Common Name: ${r.cn}`,
          r.ou ? `Organizational Unit: ${r.ou}` : null,
          r.o ? `Organization: ${r.o}` : null,
          r.l ? `Locality: ${r.l}` : null,
          r.st ? `State: ${r.st}` : null,
          r.c ? `Country: ${r.c}` : null,
          `Key Size: ${r.keySize}-bit RSA`,
          `Valid Until: ${r.validUntil}`,
          '',
          `SHA-1: ${r.sha1}`,
          `SHA-256: ${r.sha256}`,
          '',
          'This certificate and keystore were generated entirely in your browser.',
          'Keep the .keystore file and its password safe - they cannot be recovered if lost,',
          'and losing them prevents publishing further updates to an app already signed with this key.'
        ].filter(l => l !== null).join('\n');
        await exportTextAsPDF('WyDev - Android Keystore Report', report, `${r.alias}-keystore-report.pdf`);
      } else if (action === 'inspect') {
        const fileInput = document.getElementById('ks-inspect-file');
        const password = document.getElementById('ks-inspect-pass').value;
        const file = fileInput.files[0];
        if (!file) { showToast('Choose a keystore file first', 'error'); return; }
        await loadExternalLib('forge');
        if (!window.forge) { showToast('Failed to load crypto engine', 'error'); return; }
        try {
          const buffer = await file.arrayBuffer();
          const bytes = new Uint8Array(buffer);
          let binaryStr = '';
          for (let i = 0; i < bytes.length; i++) binaryStr += String.fromCharCode(bytes[i]);

          const asn1 = forge.asn1.fromDer(binaryStr);
          const p12 = forge.pkcs12.pkcs12FromAsn1(asn1, password);
          const certBags = p12.getBags({ bagType: forge.pki.oids.certBag });
          const bagArray = certBags[forge.pki.oids.certBag];
          if (!bagArray || !bagArray.length) {
            showToast('No certificate found in this keystore', 'error');
            return;
          }
          const cert = bagArray[0].cert;
          const certDer = forge.asn1.toDer(forge.pki.certificateToAsn1(cert)).getBytes();
          const sha1Hex = forge.md.sha1.create().update(certDer).digest().toHex();
          const sha256Hex = forge.md.sha256.create().update(certDer).digest().toHex();

          document.getElementById('ks-inspect-sha1').value = formatFingerprint(sha1Hex);
          document.getElementById('ks-inspect-sha256').value = formatFingerprint(sha256Hex);
          document.getElementById('ks-inspect-result').style.display = 'block';
          showToast('Fingerprints read successfully', 'success');
        } catch (e) {
          showToast('Could not open keystore - wrong password, or not a PKCS12 file', 'error');
        }
      }
    }
  }

  /************************************************************************
   * Custom Embedded Helper Algorithms
   ************************************************************************/
  function toggleJsonOutputView(type) {
    const formattedBtn = document.getElementById('btn-show-formatted');
    const treeBtn = document.getElementById('btn-show-tree');
    const textOutput = document.getElementById('json-text-output');
    const treeOutput = document.getElementById('json-tree-container');

    if (type === 'formatted') {
      formattedBtn.classList.add('active');
      treeBtn.classList.remove('active');
      textOutput.style.display = 'block';
      treeOutput.style.display = 'none';
    } else {
      formattedBtn.classList.remove('active');
      treeBtn.classList.add('active');
      textOutput.style.display = 'none';
      treeOutput.style.display = 'block';
    }
  }

  function renderJsonTreeVisual(obj) {
    const container = document.getElementById('json-tree-container');
    function createNode(key, value, isLast) {
      const li = document.createElement('li');
      li.className = 'json-tree-node';
      const isObject = value !== null && typeof value === 'object';
      const type = typeof value;
      const keySpan = document.createElement('span');
      keySpan.className = 'json-tree-key';
      keySpan.textContent = key !== null ? `"${key}": ` : '';
      li.appendChild(keySpan);

      if (isObject) {
        const isArray = Array.isArray(value);
        const openChar = isArray ? '[' : '{';
        const closeChar = isArray ? ']' : '}';
        const count = Object.keys(value).length;
        const toggle = document.createElement('span');
        toggle.className = 'json-tree-toggle';
        toggle.textContent = '▼ ';
        toggle.onclick = (e) => {
          e.stopPropagation();
          const children = li.querySelector('.json-tree-children');
          if (children.style.display === 'none') {
            children.style.display = 'block';
            toggle.textContent = '▼ ';
          } else {
            children.style.display = 'none';
            toggle.textContent = '▶ ';
          }
        };
        li.insertBefore(toggle, keySpan);

        const openSpan = document.createElement('span');
        openSpan.className = 'json-tree-bracket';
        openSpan.textContent = `${openChar} /* ${count} items */`;
        li.appendChild(openSpan);

        const childrenUl = document.createElement('ul');
        childrenUl.className = 'json-tree-children';
        childrenUl.style.paddingLeft = '15px';
        childrenUl.style.listStyle = 'none';

        const keys = Object.keys(value);
        keys.forEach((k, idx) => {
          childrenUl.appendChild(createNode(k, value[k], idx === keys.length - 1));
        });
        li.appendChild(childrenUl);

        const closeSpan = document.createElement('span');
        closeSpan.className = 'json-tree-bracket';
        closeSpan.textContent = closeChar + (isLast ? '' : ',');
        li.appendChild(closeSpan);
      } else {
        const valueSpan = document.createElement('span');
        valueSpan.className = `json-tree-value json-tree-${type}`;
        valueSpan.textContent = type === 'string' ? `"${value}"` : String(value);
        li.appendChild(valueSpan);
        if (!isLast) {
          const comma = document.createElement('span');
          comma.textContent = ',';
          li.appendChild(comma);
        }
      }
      return li;
    }
    container.innerHTML = '';
    const rootUl = document.createElement('ul');
    rootUl.className = 'json-tree-root';
    rootUl.style.listStyle = 'none';
    rootUl.appendChild(createNode(null, obj, true));
    container.appendChild(rootUl);
  }

  function toggleKeystorePasswordMode() {
    const same = document.getElementById('ks-same-pass').checked;
    const keyPassEl = document.getElementById('ks-key-pass');
    keyPassEl.disabled = same;
    if (same) keyPassEl.value = '';
  }

  // Converts a forge binary string (each char code 0-255) into a Uint8Array.
  function forgeBinaryToBytes(binaryStr) {
    const bytes = new Uint8Array(binaryStr.length);
    for (let i = 0; i < binaryStr.length; i++) {
      bytes[i] = binaryStr.charCodeAt(i) & 0xff;
    }
    return bytes;
  }

  // Formats a hex digest string as an uppercase colon-separated fingerprint, e.g. AA:BB:CC
  function formatFingerprint(hex) {
    return hex.toUpperCase().match(/.{1,2}/g).join(':');
  }

  let lastKeystoreResult = null;

  function checkPasswordStrength(password) {
    const fill = document.getElementById('pw-strength-fill');
    const label = document.getElementById('pw-strength-label');
    const entropyLabel = document.getElementById('pw-entropy');
    if (!password) {
      fill.style.width = '0%';
      label.innerText = 'None';
      entropyLabel.innerText = 'Entropy: 0 bits';
      return;
    }
    let pool = 0;
    if (/[a-z]/.test(password)) pool += 26;
    if (/[A-Z]/.test(password)) pool += 26;
    if (/[0-9]/.test(password)) pool += 10;
    if (/[^a-zA-Z0-9]/.test(password)) pool += 32;

    const entropy = Math.round(password.length * Math.log2(pool));
    entropyLabel.innerText = `Entropy: ${entropy} bits`;

    if (entropy < 40) {
      fill.style.width = '25%';
      fill.style.backgroundColor = 'var(--error)';
      label.innerText = 'Weak';
      label.style.color = 'var(--error)';
    } else if (entropy < 65) {
      fill.style.width = '50%';
      fill.style.backgroundColor = 'var(--warning)';
      label.innerText = 'Medium';
      label.style.color = 'var(--warning)';
    } else if (entropy < 85) {
      fill.style.width = '75%';
      fill.style.backgroundColor = 'var(--accent-light)';
      label.innerText = 'Strong';
      label.style.color = 'var(--accent-light)';
    } else {
      fill.style.width = '100%';
      fill.style.backgroundColor = 'var(--success)';
      label.innerText = 'Premium / Bulletproof';
      label.style.color = 'var(--success)';
    }
  }

  function hexToRgbStr(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgb(${r}, ${g}, ${b})`;
  }

  function adjustHue(hex, degree) {
    let r = parseInt(hex.slice(1, 3), 16) / 255;
    let g = parseInt(hex.slice(3, 5), 16) / 255;
    let b = parseInt(hex.slice(5, 7), 16) / 255;
    let max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if(max === min){ h = s = 0; } else {
      let d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch(max){
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h /= 6;
    }
    h = (h * 360 + degree) % 360;
    if(h < 0) h += 360;
    // convert hsl back to hex
    const hslToHex = (h, s, l) => {
      l /= 100; const a = s * Math.min(l, 1 - l) / 100;
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    };
    return hslToHex(h, s * 100, l * 100);
  }

  function shadeColor(color, percent) {
    let R = parseInt(color.substring(1,3),16);
    let G = parseInt(color.substring(3,5),16);
    let B = parseInt(color.substring(5,7),16);
    R = parseInt(R * (100 + percent) / 100);
    G = parseInt(G * (100 + percent) / 100);
    B = parseInt(B * (100 + percent) / 100);
    R = (R<255)?R:255; G = (G<255)?G:255; B = (B<255)?B:255;
    R = (R<0)?0:R; G = (G<0)?0:G; B = (B<0)?0:B;
    const rHex = R.toString(16).padStart(2, '0');
    const gHex = G.toString(16).padStart(2, '0');
    const bHex = B.toString(16).padStart(2, '0');
    return `#${rHex}${gHex}${bHex}`;
  }

  function updateFlexPlayground() {
    const dir = document.getElementById('flex-dir').value;
    const justify = document.getElementById('flex-justify').value;
    const align = document.getElementById('flex-align').value;
    const count = parseInt(document.getElementById('flex-count').value) || 3;
    const canvas = document.getElementById('flex-canvas');

    canvas.style.flexDirection = dir;
    canvas.style.justifyContent = justify;
    canvas.style.alignItems = align;

    let itemsHtml = '';
    for(let i=1; i<=count; i++) {
      itemsHtml += `<div class="flex-play-item">${i}</div>`;
    }
    canvas.innerHTML = itemsHtml;

    document.getElementById('flex-css-code').value = `display: flex;\nflex-direction: ${dir};\njustify-content: ${justify};\nalign-items: ${align};`;
  }

  /************************************************************************
   * Global Keyboard Shortcuts & Event Hooks
   ************************************************************************/
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault();
      document.getElementById('global-search').focus();
    }
  });

  document.getElementById('global-search').addEventListener('input', () => {
    if (window.location.hash !== '#home' && window.location.hash !== '') {
      navigateTo('#home');
    }
    renderHome();
  });

  /************************************************************************
   * Initialize Application Life cycle
   ************************************************************************/
  function initApp() {
    // Sync UI with state parameters
    document.documentElement.setAttribute('data-theme', State.theme);
    renderCurrentRoute();
  }

  window.addEventListener('load', initApp);
