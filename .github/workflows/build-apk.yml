name: Build WyteLab APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Android build mode
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
      version_code:
        description: Android versionCode (increase for every store update)
        required: true
        type: string
        default: "1"
      version_name:
        description: Android versionName shown to users
        required: true
        type: string
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: wyteLab-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android shell
        shell: bash
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail

          test -f .wydev/android-shell/settings.gradle
          test -f .wydev/android-shell/build.gradle
          test -f .wydev/android-shell/app/build.gradle
          test -f .wydev/android-shell/app/src/main/AndroidManifest.xml
          test -f .wydev/android-shell/app/src/main/java/com/wydev/wrapper/MainActivity.java
          test -f .wydev/android-shell/app/src/main/res/drawable-nodpi/wytelab_icon.png

          rm -rf wydev-wrapper
          cp -R .wydev/android-shell wydev-wrapper

          rm -rf wydev-wrapper/app/src/main/assets/www
          mkdir -p wydev-wrapper/app/src/main/assets/www
          cp -R dist/. wydev-wrapper/app/src/main/assets/www/

          # Keep the current native feature set used by the maintained shell.
          sed -i 's/__FEATURE_FULL_SCREEN__/true/g' wydev-wrapper/app/src/main/java/com/wydev/wrapper/MainActivity.java || true
          sed -i 's/__APP_NAME__/WyteLab App/g' wydev-wrapper/app/src/main/AndroidManifest.xml

          # Make the store version explicit and reproducible.
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("wydev-wrapper/app/build.gradle")
          s = p.read_text()
          vc = os.environ["VERSION_CODE"]
          vn = os.environ["VERSION_NAME"]
          if not re.fullmatch(r"[1-9][0-9]*", vc):
              raise SystemExit("version_code must be a positive integer")
          if not re.fullmatch(r"[0-9A-Za-z][0-9A-Za-z.+_-]*", vn):
              raise SystemExit("version_name contains unsupported characters")
          s = re.sub(r"versionCode\s+\d+", f"versionCode {vc}", s)
          s = re.sub(r'versionName\s+"[^"]+"', f'versionName "{vn}"', s)
          p.write_text(s)
          PY

      - name: Build Android release/debug APK
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          set -euo pipefail
          cd wydev-wrapper
          if [ "$BUILD_MODE" = "debug" ]; then
            gradle assembleDebug --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Sign release APK
        if: inputs.build_mode == 'release'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          APK="$(find wydev-wrapper/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          KEYSTORE="$RUNNER_TEMP/wydev-release.jks"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ANDROID_KEY_ALIAS:-}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD:-}" ] && \
             [ -n "${ANDROID_STORE_PASSWORD:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            ALIAS="$ANDROID_KEY_ALIAS"
            STORE_PASSWORD="$ANDROID_STORE_PASSWORD"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::Persistent Android signing secrets are not configured. A temporary signing key will be generated for this build. Do not use this artifact for an update that must preserve the same signing identity."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass "temporary-store-password" \
              -keypass "temporary-key-password" \
              -alias "wytelab" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=WyteLab, O=WyteLab, C=NG"
            ALIAS="wytelab"
            STORE_PASSWORD="temporary-store-password"
            KEY_PASSWORD="temporary-key-password"
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/WyteLab.apk" \
            "$APK"

          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/WyteLab.apk"

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            cp "$RUNNER_TEMP/WyteLab.apk" "release/WyteLab-${{ inputs.version_name }}.apk"
          else
            cp wydev-wrapper/app/build/outputs/apk/debug/*.apk "release/WyteLab-${{ inputs.version_name }}-debug.apk"
          fi
          sha256sum release/*.apk > release/SHA256SUMS.txt
          ls -lh release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WyteLab-Android-${{ inputs.version_name }}-${{ inputs.build_mode }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
