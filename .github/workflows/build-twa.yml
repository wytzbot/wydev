name: Build WyteLab TWA (Bubblewrap)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (must increase for every store update)
        required: true
        type: string
        default: "1"
      version_name:
        description: Android versionName shown to users
        required: true
        type: string
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build-twa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Restore keystore
        shell: bash
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Install Bubblewrap and point it at the JDK and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          npm i -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<JSON
          {"jdkPath":"$JAVA_HOME","androidSdkPath":"${ANDROID_SDK_ROOT:-$ANDROID_HOME}"}
          JSON

      - name: Apply version and generate the Android project
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const fs=require('fs');const m=JSON.parse(fs.readFileSync('twa-manifest.json','utf8'));
            m.appVersion='${{ inputs.version_code }}';m.appVersionName='${{ inputs.version_name }}';
            fs.writeFileSync('twa-manifest.json',JSON.stringify(m,null,2));"
          bubblewrap update --manifest=./twa-manifest.json --skipVersionUpgrade

      - name: Build signed APK and AAB
        shell: bash
        run: bubblewrap build --skipPwaValidation

      - name: Print signing fingerprint (goes in assetlinks.json)
        shell: bash
        run: |
          {
            echo "### Signing certificate SHA-256"
            echo '```'
            keytool -list -v -keystore android.keystore -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep "SHA256:"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wytelab-twa
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          if-no-files-found: error
