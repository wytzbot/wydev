# wydev-workflow-version: 28
name: WyteLab
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build target
        required: true
        type: choice
        options: [both, aab, apk]
        default: both
      build_mode:
        description: release = Play Store signed, debug = quick test
        required: true
        type: choice
        options: [release, debug]
        default: release
      version_code:
        description: versionCode (must increase on every Play upload)
        required: true
        type: string
        default: "1"
      version_name:
        description: versionName shown to users
        required: true
        type: string
        default: "1.0.0"
      native_features:
        description: Native Web-to-App features
        required: false
        type: string
        default: FULLSCREEN,NETWORK_STATUS,DEVICE_INFO,DOWNLOADS,SHARE,VIBRATION,ORIENTATION,BATTERY,EXTERNAL_LINKS,LOCAL_NOTIFICATIONS,DEEP_LINKS
run-name: "WyteLab ${{ inputs.build_type }} ${{ inputs.build_mode }} v${{ inputs.version_name }} (${{ inputs.version_code }})"
permissions:
  contents: read
concurrency:
  group: wydev-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.build_mode }}
      TARGET: ${{ inputs.build_type }}
      VC: ${{ inputs.version_code }}
      VN: ${{ inputs.version_name }}
      FEATURES: ${{ inputs.native_features }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs and signing secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_STOREPASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$VC" =~ ^[1-9][0-9]*$ ]] || { echo "::error::version_code must be a positive integer"; exit 1; }
          [[ "$VN" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]] || { echo "::error::invalid version_name"; exit 1; }
          if [ "$MODE" = release ]; then
            for v in KS_B64 KS_ALIAS KS_KEYPASS KS_STOREPASS; do
              [ -n "${!v}" ] || { echo "::error::Missing signing secret ($v). Play Store needs one permanent upload key - see GITHUB-APK-BUILD.md"; exit 1; }
            done
            printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KS_KEYPASS" >> "$GITHUB_ENV"
            echo "ANDROID_STORE_PASSWORD=$KS_STOREPASS" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Build web app
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          test -f dist/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Android shell
        run: |
          set -euo pipefail
          cp -R .wydev/android-shell wydev-wrapper
          mkdir -p wydev-wrapper/app/src/main/assets/www
          cp -R dist/. wydev-wrapper/app/src/main/assets/www/
          F="wydev-wrapper/app/src/main/java/com/wydev/wrapper/MainActivity.java"
          FEATURES="$(printf '%s' "${FEATURES:-}" | tr '[:lower:]' '[:upper:]')"
          for key in CAMERA_MIC LOCATION DOWNLOADS EXTERNAL_LINKS FULLSCREEN SHARE VIBRATION ORIENTATION BATTERY NETWORK_STATUS DEVICE_INFO LOCAL_NOTIFICATIONS BIOMETRIC SECURE_STORAGE SCREEN_CAPTURE PICTURE_IN_PICTURE DEEP_LINKS; do
            case ",$FEATURES," in *",$key,"*) v=true;; *) v=false;; esac
            sed -i "s/__FEATURE_${key}__/$v/g" "$F"
          done
          sed -i "s/__APP_NAME__/WyteLab App/g" wydev-wrapper/app/src/main/AndroidManifest.xml
          ! grep -rn "__FEATURE_\|__APP_NAME__" wydev-wrapper/app/src/main

      - name: Build with Gradle
        working-directory: wydev-wrapper
        run: |
          set -euo pipefail
          if [ "$MODE" = debug ]; then TASKS="assembleDebug"
          else
            case "$TARGET" in apk) TASKS="assembleRelease";; aab) TASKS="bundleRelease";; *) TASKS="assembleRelease bundleRelease";; esac
          fi
          gradle $TASKS -Pvc="$VC" -Pvn="$VN" --no-daemon --stacktrace

      - name: Verify and collect
        run: |
          set -euo pipefail
          mkdir -p out
          B=wydev-wrapper/app/build/outputs
          if [ "$MODE" = debug ]; then
            cp $B/apk/debug/*.apk "out/WyteLab-$VN-debug.apk"
          else
            TOOL="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
            if [ "$TARGET" != aab ]; then
              cp $B/apk/release/*.apk "out/WyteLab-$VN.apk"
              "$TOOL" verify --verbose "out/WyteLab-$VN.apk"
            fi
            if [ "$TARGET" != apk ]; then
              cp $B/bundle/release/*.aab "out/WyteLab-$VN.aab"
              jarsigner -verify "out/WyteLab-$VN.aab" | grep -q "jar verified"
              keytool -printcert -jarfile "out/WyteLab-$VN.aab" | grep -E "SHA256|Owner"
            fi
          fi
          (cd out && sha256sum * > SHA256SUMS.txt); ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: WyteLab-${{ inputs.version_name }}-${{ inputs.build_mode }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Notify WyteLab of failed build
        if: failure()
        continue-on-error: true
        run: |
          curl --fail-with-body --max-time 15 -X POST "https://wyte.name.ng/api/notifications/build-failed" \
            -H "Authorization: Bearer ${{ github.token }}" -H "Content-Type: application/json" \
            --data "{\"repository\":\"${{ github.repository }}\",\"runId\":\"${{ github.run_id }}\"}" || true
